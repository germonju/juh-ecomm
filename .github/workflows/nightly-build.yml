name: Nightly Build — HTML statique articles blog

on:
  schedule:
    # Tous les jours à 3h du matin (heure de Paris)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Permet aussi de lancer manuellement depuis GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Commit et push si changements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add dist/
          if git diff --cached --quiet; then
            echo "Aucun changement dans dist/ — rien à commiter."
          else
            ARTICLE_COUNT=$(git diff --cached --name-only | grep "^dist/blog/" | grep "index.html" | wc -l | tr -d ' ')
            git commit -m "build: mise à jour automatique dist/ (${ARTICLE_COUNT} articles blog)"
            git push origin main
          fi
